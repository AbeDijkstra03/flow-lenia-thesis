[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-lenia"
version = "0.1.0"
description = "GPU-Accelerated Flow-Lenia Open-Ended Evolution Framework in JAX"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "Pillow>=9.5.0",
    "imageio>=2.30.0",
    "imageio-ffmpeg>=0.4.8",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "experiments*"]
