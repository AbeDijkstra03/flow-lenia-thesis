name: Flow-Lenia CI/CD Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run Automated Unit Tests
      run: |
        python -m unittest discover tests -v

    - name: Run Physics Verification Smoke Test
      run: |
        python run_experiment.py --mode orbium
        python run_experiment.py --config configs/baseline.yaml --trials 2 --bootstrap 1 --steps 20 --output_dir results/ci_smoke_test
