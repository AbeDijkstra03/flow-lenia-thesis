# Open Homogeneous Environment IMGEP Curiosity Search Configuration
experiment:
  name: "imgep_open_search"
  env: "open"
  trials: 50
  bootstrap: 10
  seed: 42

simulation:
  grid_size: 256
  steps: 2000
  sample_interval: 50
  dt: 0.05

physics:
  v_scale: 5.2
  alpha_diffusion: 0.06
  beta: 2.0
  n_kernels: 9
  kernel_radii_range: [6.0, 15.0]

biology:
  n_patches: 6
  mu_range: [0.13, 0.22]
  sigma_range: [0.011, 0.024]
  mixing_rule: "gene_wise"
  enable_mutation: true

metrics:
  goal_space: ["com_displacement", "ea_raw", "complexity_raw"]
