# Chapter 2B: Softmax Growth Negotiation Competition Ablation
experiment:
  name: "negotiation_rule"
  output_dir: "results/negotiation_rule"
  seed: 42

simulation:
  grid_size: 384
  steps: 3600
  sample_interval: 3
  dt: 0.05

physics:
  v_scale: 5.4
  alpha_diffusion: 0.055
  beta: 3.0
  n_kernels: 9
  kernel_radii_range: [6.0, 15.0]

biology:
  n_patches: 6
  mu_range: [0.13, 0.22]
  sigma_range: [0.011, 0.024]
  mixing_rule: "negotiation"
  enable_mutation: true
  mutation_interval: 60
