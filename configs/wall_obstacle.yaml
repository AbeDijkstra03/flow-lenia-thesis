# Static Wall Obstacle Environment Configuration with Passages
experiment:
  name: "wall_obstacle"
  env: "wall"
  trials: 50
  bootstrap: 10
  seed: 42
  output_dir: "results/wall_obstacles"

simulation:
  grid_size: 256
  steps: 2000
  sample_interval: 50
  dt: 0.05

environment:
  num_barriers: 2
  wall_thickness: 8
  passage_width: 20

physics:
  v_scale: 5.2
  alpha_diffusion: 0.06
  beta: 2.0
  n_kernels: 9

biology:
  n_patches: 6
  mu_range: [0.13, 0.22]
  sigma_range: [0.011, 0.024]
  mixing_rule: "gene_wise"
  enable_mutation: true

metrics:
  goal_space: ["com_norm", "corridor_coverage", "ea_norm"]
