# Chapter 1: Physics Verification on Canonical Orbium unicaudatus
experiment:
  name: "orbium_physics_verification"
  output_dir: "results/orbium"
  seed: 42

simulation:
  grid_size: 256
  steps: 2000
  sample_interval: 5
  dt: 0.05

physics:
  v_scale: 5.0
  alpha_diffusion: 0.0
  n_kernels: 1
  kernel_radius: 13.0

biology:
  organism: "Orbium unicaudatus"
  mu: 0.15
  sigma: 0.015
  mixing_rule: "gene_wise"
  enable_mutation: false
